<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- <button id="rzp-button1">Pay</button> -->
    <div class="loading-wave">
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
    </div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
import { apiFetch } from "../apiFetch.js";

// Add a flag to prevent ondismiss from triggering on success
let isPaymentSuccess = false; 

var options = {
    "key": localStorage.getItem("keyID") || "rzp_test_TRYzORwbdoZYPQ",
    "amount": localStorage.getItem("amount") || 500, 
    "currency": localStorage.getItem("currency") || "INR",
    "name": "VedKriti",
    "description": "Consultation Fee",
    "image": "logo.webp",
    "order_id": localStorage.getItem("orderID"),
    
    "handler": async function (response) {
        // 1. Payment succeeded! Set flag so ondismiss ignores the close event.
        isPaymentSuccess = true; 

        try {
            const book = await apiFetch("/api/payment/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    bookingId: localStorage.getItem("bookingID"),
                    razorpayOrderId: response.razorpay_order_id,
                    razorpayPaymentId: response.razorpay_payment_id,
                    razorpaySignature: response.razorpay_signature
                })
            });
            const data = await book.json();
            
            if (!book.ok) {
                throw new Error(data.message || "Booking verification failed.");
            } else {
                alert(data.message || "Booking Successful!");
                globalThis.location.href = "../home/pat-home.html";
            }
        } catch(error) {
            alert(error);
            globalThis.location.href = "../home/pat-home.html";
        }
    },

    "modal": {
        ondismiss: async function () {
            // 2. If the modal closed because of a success, do nothing!
            if (isPaymentSuccess) {
                return; 
            }

            console.log("User closed the payment popup manually.");
            alert("Payment cancelled by user. Releasing your slot.");
            
            try {
                const book = await apiFetch("/api/payment/cancel", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ bookingId: localStorage.getItem("bookingID") })
                });
                const data = await book.json();
                
                if (!book.ok) {
                    throw new Error(data.message || "Unable to free the booked slot.");
                } else {
                    alert(data.message || "Cancellation Successful");
                } 
            } catch(error) {
                alert(error);
            } finally {
                // Always redirect back home
                globalThis.location.href = "../home/pat-home.html";
            }
        }
    },
    
    "prefill": {
        "name": "Patient", 
        "email": "patient@example.com", 
        "contact": "+919999999999"  
    },
    "theme": {
        "color": "#3399cc"
    }
};

var rzp1 = new Razorpay(options);

rzp1.on('payment.failed', function (response) {
    alert("Payment Failed: " + response.error.reason);
});

// Auto-open Razorpay when the page loads
rzp1.open();
</script>
 </body> </html>
